name: Build & Test APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit & Stress Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Generate Cryptographic SHA-256 Checksums
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/*.apk release-artifacts/ || true
          cd release-artifacts
          sha256sum *.apk > SHA256SUMS.txt
          echo "=== Generated SHA-256 Checksums ==="
          cat SHA256SUMS.txt

      - name: Upload APK & Checksum Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Evi-Unofficial-Release
          path: release-artifacts/
